# PipeWire drop-in: a virtual sink "OBS to Zoom" that OBS monitors into, and a virtual
# microphone "OBS Mic (for Zoom)" that carries whatever arrives there. Pick that microphone in Zoom.
# Installed to ~/.config/pipewire/pipewire.conf.d/ by setup-obs-flatpak.sh.
context.objects = [
    {
        factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "obs_zoom"
            node.description = "OBS to Zoom"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            object.linger    = true
        }
    }
]

context.modules = [
    {
        name = libpipewire-module-loopback
        args = {
            node.description = "OBS Mic (for Zoom)"
            capture.props = {
                node.target         = "obs_zoom"
                stream.capture.sink = true
                node.passive        = true
            }
            playback.props = {
                node.name   = "obs_mic"
                media.class = Audio/Source
            }
        }
    }
]
