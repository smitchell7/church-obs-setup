# PipeWire drop-in: a virtual speaker "OBS to Zoom" (node "obs_zoom") that OBS monitors its audio into.
# The microphone Zoom picks, "OBS Mic (for Zoom)", is made from this speaker's monitor by
# audio/obs-mic.conf (a pipewire-pulse drop-in).
# Installed to ~/.config/pipewire/pipewire.conf.d/ by setup-obs-flatpak.sh.
context.objects = [
    {
        factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "obs_zoom"
            node.description = "OBS to Zoom"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            object.linger    = true
        }
    }
]
