# PipeWire drop-in: a virtual speaker (node "obs_zoom") that only OBS uses: OBS monitors its audio into it.
# The microphone Zoom picks, "OBS Mic (for Zoom)", is made from this speaker's monitor by
# audio/obs-mic.conf (a pipewire-pulse drop-in).
#
# Its name says not to pick it in Zoom: as Zoom's speaker it would send the meeting back into the
# microphone. A low priority keeps it from ever becoming the system's default speaker.
# Installed to ~/.config/pipewire/pipewire.conf.d/ by setup-obs-flatpak.sh.
context.objects = [
    {
        factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "obs_zoom"
            node.description = "OBS Monitoring (not for Zoom)"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            priority.session = 1
            object.linger    = true
        }
    }
]
