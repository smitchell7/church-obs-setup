# PipeWire drop-in: removes mains hum from the USB microphone before OBS hears it. Four narrow notch
# filters (Q 30, about 2 Hz wide at 60 Hz) at 60, 120, 180 and 240 Hz, applied to both channels. OBS has no
# notch filter of its own, so OBS's "USB Audio" source records the virtual microphone "USB Audio (hum
# filtered)" (node hum_notch) instead of the hardware.
#
# @AUDIO_DEVICE@ is replaced by setup-obs-flatpak.sh with the hardware microphone's name.
# Installed to ~/.config/pipewire/pipewire.conf.d/ by setup-obs-flatpak.sh.
# To tune: raise Q (narrower) if voices sound hollow; add 300 Hz if a buzz remains.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "USB Audio (hum filtered)"
            media.name       = "USB Audio (hum filtered)"
            filter.graph = {
                nodes = [
                    { type = builtin name = l60  label = bq_notch control = { "Freq" = 60.0  "Q" = 30.0 } }
                    { type = builtin name = l120 label = bq_notch control = { "Freq" = 120.0 "Q" = 30.0 } }
                    { type = builtin name = l180 label = bq_notch control = { "Freq" = 180.0 "Q" = 30.0 } }
                    { type = builtin name = l240 label = bq_notch control = { "Freq" = 240.0 "Q" = 30.0 } }
                    { type = builtin name = r60  label = bq_notch control = { "Freq" = 60.0  "Q" = 30.0 } }
                    { type = builtin name = r120 label = bq_notch control = { "Freq" = 120.0 "Q" = 30.0 } }
                    { type = builtin name = r180 label = bq_notch control = { "Freq" = 180.0 "Q" = 30.0 } }
                    { type = builtin name = r240 label = bq_notch control = { "Freq" = 240.0 "Q" = 30.0 } }
                ]
                links = [
                    { output = "l60:Out"  input = "l120:In" }
                    { output = "l120:Out" input = "l180:In" }
                    { output = "l180:Out" input = "l240:In" }
                    { output = "r60:Out"  input = "r120:In" }
                    { output = "r120:Out" input = "r180:In" }
                    { output = "r180:Out" input = "r240:In" }
                ]
                inputs  = [ "l60:In"  "r60:In" ]
                outputs = [ "l240:Out" "r240:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name     = "hum_notch_in"
                node.passive  = true
                target.object = "@AUDIO_DEVICE@"
            }
            playback.props = {
                node.name    = "hum_notch"
                media.class  = Audio/Source
                priority.session = 1
            }
        }
    }
]
