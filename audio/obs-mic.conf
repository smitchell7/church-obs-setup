# pipewire-pulse drop-in: the microphone "OBS Mic (for Zoom)" (source "obs_mic"), which carries whatever
# OBS sends to the "OBS to Zoom" speaker (see audio/obs-to-zoom.conf). Pick it as the microphone in Zoom.
#
# It is a PulseAudio remap of the speaker's monitor, so Zoom and other PulseAudio apps list it as an
# ordinary microphone. (A loopback defined in pipewire.conf.d is not registered for them, and an
# Audio/Duplex device is not linked to apps by WirePlumber.)
# Installed to ~/.config/pipewire/pipewire-pulse.conf.d/ by setup-obs-flatpak.sh.
pulse.cmd = [
    { cmd = "load-module" args = "module-remap-source master=obs_zoom.monitor source_name=obs_mic source_properties='device.description=\"OBS Mic (for Zoom)\"'" flags = [ ] }
]
