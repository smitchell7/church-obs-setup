; The OBS window layout the setup and update scripts install (tools/set-obs-docks.py, tools/set-obs-docks.ps1).
; Captured from the Ubuntu test VM: Scenes, Sources, Audio Mixer, PTZ Controls, Controls and Transitions docked;
; Downstream Keyer and Stats closed (open them from the Docks menu). Side docks and the vertical mixer are on.
; The window's position and size (geometry) are deliberately left out, so OBS stays on whatever screen and at
; whatever size each computer uses (some have several screens); the docks are placed relative to the window.
; To change it: arrange OBS, close it, and copy DockState, SideDocks and VerticalVolumeControl from [BasicWindow]
; in user.ini in its config folder (not geometry).
; Every setup and update puts this layout back, so docks closed or moved by accident are fixed.
[BasicWindow]

SideDocks=true
VerticalVolumeControl=true
